name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - preview
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: samesh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Test and publish Cloudflare Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run tests
        run: npm test

      - name: Syntax-check ES modules
        run: |
          node --check src/app.mjs
          node --check src/links.mjs
          node --check scripts/build.mjs

      - name: Build static artifact
        run: npm run build

      - name: Verify artifact
        run: |
          test -f build/index.html
          test -f build/assets/style.css
          test -f build/assets/samug-logo.png
          test -f build/assets/au-flag.png
          test -f build/assets/favicon.ico
          test -f build/assets/favicon-32.png
          test -f build/assets/favicon-192.png
          test -f build/src/app.mjs
          test -f build/deploy-info.json
          test ! -e build/.git
          test ! -e build/node_modules

      - name: Ensure Cloudflare Pages project exists
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.118.0 pages project create samesh --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npx --yes wrangler@4.118.0 pages deploy build --project-name=samesh --branch="$CF_PAGES_BRANCH" --commit-dirty=true

      - name: Ensure production custom domain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: samesh
          CF_PAGES_DOMAIN: samesh.au
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          project = os.environ['CF_PAGES_PROJECT']
          domain = os.environ['CF_PAGES_DOMAIN']
          base = f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}/domains'
          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
          }

          def request(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          try:
              existing = request('GET', base).get('result') or []
              names = {item.get('name') for item in existing if isinstance(item, dict)}
              if domain in names:
                  print(f'Cloudflare Pages custom domain already present: {domain}')
              else:
                  result = request('POST', base, {'name': domain})
                  if not result.get('success'):
                      raise SystemExit(f'Cloudflare API did not accept custom domain {domain}: {result}')
                  print(f'Cloudflare Pages custom domain requested: {domain}')
          except urllib.error.HTTPError as exc:
              payload = exc.read().decode('utf-8', 'replace')
              if exc.code in (409, 400) and domain in payload:
                  print(f'Cloudflare Pages custom domain appears to already exist: {domain}')
              else:
                  raise SystemExit(f'Cloudflare Pages custom domain setup failed for {domain}: HTTP {exc.code} {payload}')
          PY

      - name: Ensure production DNS record
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_NAME: samesh.au
          CF_RECORD_NAME: samesh.au
          CF_RECORD_TARGET: samesh.pages.dev
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ['CLOUDFLARE_API_TOKEN']
          zone_name = os.environ['CF_ZONE_NAME']
          record_name = os.environ['CF_RECORD_NAME']
          target = os.environ['CF_RECORD_TARGET']
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          def request(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              if not payload.get('success'):
                  raise SystemExit(f'Cloudflare API returned failure for {url}: {payload}')
              return payload

          zones = request('GET', 'https://api.cloudflare.com/client/v4/zones?' + urllib.parse.urlencode({'name': zone_name})).get('result') or []
          if not zones:
              raise SystemExit(f'Cloudflare zone not found: {zone_name}')
          zone_id = zones[0]['id']
          records_url = f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records'
          query = urllib.parse.urlencode({'name': record_name})
          records = request('GET', f'{records_url}?{query}').get('result') or []
          desired = {'type': 'CNAME', 'name': record_name, 'content': target, 'proxied': True, 'ttl': 1}

          cname = next((record for record in records if record.get('type') == 'CNAME'), None)
          if cname:
              if cname.get('content') == target and cname.get('proxied') is True:
                  print(f'DNS already points {record_name} -> {target}')
              else:
                  request('PATCH', f"{records_url}/{cname['id']}", desired)
                  print(f'Updated DNS {record_name} -> {target}')
          elif records:
              raise SystemExit(f'DNS record exists for {record_name} but is not CNAME; update manually or extend workflow: {[(r.get("type"), r.get("content")) for r in records]}')
          else:
              request('POST', records_url, desired)
              print(f'Created DNS {record_name} -> {target}')
          PY
