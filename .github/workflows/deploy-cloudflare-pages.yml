name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - preview
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: samesh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Test and publish Cloudflare Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run tests
        run: npm test

      - name: Syntax-check ES modules
        run: |
          node --check src/app.mjs
          node --check src/links.mjs
          node --check scripts/build.mjs

      - name: Build static artifact
        run: npm run build

      - name: Verify artifact
        run: |
          test -f build/index.html
          test -f build/assets/style.css
          test -f build/assets/samug-logo.png
          test -f build/assets/au-flag.png
          test -f build/assets/favicon.ico
          test -f build/assets/favicon-32.png
          test -f build/assets/favicon-192.png
          test -f build/src/app.mjs
          test -f build/deploy-info.json
          test ! -e build/.git
          test ! -e build/node_modules

      - name: Ensure Cloudflare Pages project exists
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.118.0 pages project create samesh --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npx --yes wrangler@4.118.0 pages deploy build --project-name=samesh --branch="$CF_PAGES_BRANCH" --commit-dirty=true

      - name: Ensure production custom domain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: samesh
          CF_PAGES_DOMAIN: samesh.au
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          project = os.environ['CF_PAGES_PROJECT']
          domain = os.environ['CF_PAGES_DOMAIN']
          base = f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}/domains'
          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
          }

          def request(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          try:
              existing = request('GET', base).get('result') or []
              names = {item.get('name') for item in existing if isinstance(item, dict)}
              if domain in names:
                  print(f'Cloudflare Pages custom domain already present: {domain}')
              else:
                  result = request('POST', base, {'name': domain})
                  if not result.get('success'):
                      raise SystemExit(f'Cloudflare API did not accept custom domain {domain}: {result}')
                  print(f'Cloudflare Pages custom domain requested: {domain}')
          except urllib.error.HTTPError as exc:
              payload = exc.read().decode('utf-8', 'replace')
              if exc.code in (409, 400) and domain in payload:
                  print(f'Cloudflare Pages custom domain appears to already exist: {domain}')
              else:
                  raise SystemExit(f'Cloudflare Pages custom domain setup failed for {domain}: HTTP {exc.code} {payload}')
          PY
